<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nova ocorrência</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><header class="topbar"><div class="brand">💡 IluminaPG - Nova ocorrência</div></header><main class="wrap"><form id="formOcorrencia"><section class="card"><h2>Localização</h2><div class="grid"><div class="field"><label>Bairro</label><input id="bairro" required></div><div class="field"><label>Logradouro</label><input id="logradouro" required></div><div class="field"><label>Número / referência</label><input id="numero" required></div><div class="field"><label>CEP</label><input id="cep"></div></div></section><section class="card"><h2>Problema</h2><div class="field"><label>Tipo de ocorrência</label><select id="tipo" required><option value="">Selecione</option><option>Luminária apagada</option><option>Luminária acesa durante o dia</option><option>Luminária piscando</option><option>Poste sem luminária</option></select></div><div class="field"><label>Observações</label><textarea id="descricao"></textarea></div></section><section class="card"><h2>Solicitante</h2><div class="grid"><div class="field"><label>Nome</label><input id="nome" required></div><div class="field"><label>Telefone</label><input id="telefone" required></div><div class="field"><label>E-mail</label><input id="email" type="email" required></div></div></section><div id="mensagem"></div><button class="btn primary">Enviar e gerar protocolo</button></form></main><script src="supabase-config.js"></script><script src="cidadao.js"></script></body></html>
