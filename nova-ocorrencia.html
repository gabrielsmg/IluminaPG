<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Registrar ocorrência</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body>
<header class="topbar"><div class="topbar-inner"><div class="brand"><div class="brand-mark">💡</div><div><div class="brand-title">IluminaPG</div><div class="brand-subtitle">Registrar ocorrência</div></div></div><nav class="nav"><a href="index.html">← Início</a><a href="consulta.html">Consultar protocolo</a></nav></div></header>
<main class="wrap"><form id="formOcorrencia">
<section class="card"><div class="card-title"><span>📍</span><h2>Local da ocorrência</h2></div><div class="grid-2"><div class="field"><label>Bairro</label><input id="bairro" required></div><div class="field"><label>Logradouro</label><input id="logradouro" required></div><div class="field"><label>Número / referência</label><input id="numero" required></div><div class="field"><label>CEP (opcional)</label><input id="cep"></div></div></section>
<section class="card"><div class="card-title"><span>💡</span><h2>Problema encontrado</h2></div><div class="problem-grid">
<label class="problem"><input type="radio" name="tipo" value="Luminária apagada" required>🌙 Luminária apagada</label>
<label class="problem"><input type="radio" name="tipo" value="Luminária acesa durante o dia">☀️ Luminária acesa durante o dia</label>
<label class="problem"><input type="radio" name="tipo" value="Luminária piscando">✨ Luminária piscando</label>
<label class="problem"><input type="radio" name="tipo" value="Poste sem luminária">🚧 Poste sem luminária</label></div>
<div class="field" style="margin-top:16px"><label>Observações</label><textarea id="descricao"></textarea></div></section>
<section class="card"><div class="card-title"><span>👤</span><h2>Dados do solicitante</h2></div><div class="grid-2"><div class="field"><label>Nome completo</label><input id="nome" required></div><div class="field"><label>Telefone</label><input id="telefone" required></div><div class="field"><label>E-mail</label><input id="email" type="email" required></div></div></section>
<div id="mensagem" class="alert"></div><button class="btn btn-primary">Enviar e gerar protocolo</button></form></main>
<script src="supabase-config.js"></script><script src="cidadao.js"></script></body></html>
