<!doctype html>

<html lang="pt-BR">

<head>

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>
        Consulta - IluminaPG
    </title>


    <link
        rel="stylesheet"
        href="style.css"
    >


    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>

</head>


<body>


<header class="topbar">


    <div class="topbar-inner">


        <div class="brand">


            <div class="brand-mark">
                💡
            </div>


            <div>

                <div class="brand-title">
                    IluminaPG
                </div>

                <div class="brand-subtitle">
                    Consulta de protocolo
                </div>

            </div>


        </div>



        <nav class="nav">


            <a href="index.html">
                ← Início
            </a>


            <a href="nova-ocorrencia.html">
                Nova ocorrência
            </a>


        </nav>


    </div>


</header>



<main class="wrap">


    <section class="card">


        <div class="card-title">

            <span>
                🔎
            </span>

            <h2>
                Acompanhar solicitação
            </h2>

        </div>



        <form id="formConsulta">


            <div class="field">


                <label for="protocolo">
                    Protocolo
                </label>


                <input
                    id="protocolo"
                    type="text"
                    placeholder="Ex.: PG2026-000001"
                    required
                >


            </div>



            <button
                type="submit"
                class="btn btn-dark"
            >
                Consultar
            </button>


        </form>



        <div
            id="mensagem"
            class="alert"
        ></div>



        <div id="resultado">
        </div>


    </section>


</main>



<footer class="footer">

    IluminaPG • Consulta de solicitações

</footer>



<script src="supabase-config.js"></script>

<script src="consulta.js"></script>


</body>

</html>
