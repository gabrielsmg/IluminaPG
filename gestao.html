<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gestão</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><header class="topbar"><div class="brand">🏛️ IluminaPG Gestão</div><div class="nav"><a href="index.html">Área do cidadão</a> <button id="btnSair" style="display:none">Sair</button></div></header><main class="wrap"><section id="loginCard" class="card"><h2>Acesso administrativo</h2><form id="formLogin"><div class="field"><label>E-mail</label><input id="loginEmail" type="email" required></div><div class="field"><label>Senha</label><input id="loginSenha" type="password" required></div><div id="loginMsg"></div><button class="btn dark">Entrar</button></form></section><section id="painel" style="display:none"><div class="stats"><div class="stat"><strong id="a">0</strong><span>Abertos</span></div><div class="stat"><strong id="b">0</strong><span>Em análise</span></div><div class="stat"><strong id="c">0</strong><span>Encaminhados</span></div><div class="stat"><strong id="d">0</strong><span>Concluídos</span></div></div><section class="card"><h2>Chamados</h2><div class="field"><input id="filtro" placeholder="Pesquisar protocolo, bairro ou logradouro"></div><div class="tablewrap"><table class="table"><thead><tr><th>Protocolo</th><th>Bairro</th><th>Ocorrência</th><th>Status</th><th></th></tr></thead><tbody id="tabela"></tbody></table></div></section><section id="detalhes" class="card" style="display:none"><h2>Atendimento</h2><div id="dados"></div><div class="grid"><div class="field"><label>Status</label><select id="status"><option value="aberto">Aberto</option><option value="em_analise">Em análise</option><option value="encaminhado">Encaminhado para equipe</option><option value="concluido">Concluído</option></select></div><div class="field"><label>Equipe responsável</label><input id="equipe"></div></div><div class="field"><label>Retorno da Prefeitura</label><textarea id="retorno"></textarea></div><button id="salvar" class="btn success">Salvar atendimento</button></section></section></main><script src="supabase-config.js"></script><script src="gestao.js"></script></body></html>
