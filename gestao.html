<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gestão</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body>
<header class="topbar"><div class="topbar-inner"><div class="brand"><div class="brand-mark">🏛️</div><div><div class="brand-title">IluminaPG Gestão</div><div class="brand-subtitle">Painel administrativo</div></div></div><nav class="nav"><a href="index.html">Área do cidadão</a><button id="btnSair" style="display:none">Sair</button></nav></div></header>
<main class="wrap"><section id="loginCard" class="card"><h2>Acesso administrativo</h2><form id="formLogin"><div class="field"><label>E-mail</label><input id="loginEmail" type="email" required></div><div class="field"><label>Senha</label><input id="loginSenha" type="password" required></div><div id="loginMsg" class="alert"></div><button class="btn btn-dark">Entrar</button></form></section>
<section id="painel" style="display:none"><div class="stats"><div class="stat"><div class="n" id="a">0</div><div class="t">Abertos</div></div><div class="stat"><div class="n" id="b">0</div><div class="t">Em análise</div></div><div class="stat"><div class="n" id="c">0</div><div class="t">Encaminhados</div></div><div class="stat"><div class="n" id="d">0</div><div class="t">Concluídos</div></div></div>
<section class="card"><div class="card-title"><span>📋</span><h2>Chamados recebidos</h2></div><div class="toolbar"><input id="filtro" placeholder="Pesquisar protocolo, bairro ou logradouro"><select id="filtroStatus"><option value="">Todos os status</option><option value="aberto">Aberto</option><option value="em_analise">Em análise</option><option value="encaminhado">Encaminhado</option><option value="concluido">Concluído</option></select><button id="btnAtualizar" class="btn btn-light">Atualizar</button></div><div class="tablewrap"><table class="table"><thead><tr><th>Protocolo</th><th>Bairro</th><th>Ocorrência</th><th>Status</th><th>Ação</th></tr></thead><tbody id="tabela"></tbody></table></div></section>
<section id="detalhes" class="card" style="display:none"><h2>Atendimento</h2><div id="dados"></div><div class="grid-2"><div class="field"><label>Status</label><select id="status"><option value="aberto">Aberto</option><option value="em_analise">Em análise</option><option value="encaminhado">Encaminhado</option><option value="concluido">Concluído</option></select></div><div class="field"><label>Equipe responsável</label><input id="equipe"></div></div><div class="field"><label>Retorno da Prefeitura</label><textarea id="retorno"></textarea></div><button id="salvar" class="btn btn-success">Salvar atendimento</button></section></section></main>
<script src="supabase-config.js"></script><script src="gestao.js"></script></body></html>
